<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de personagens</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #20252b;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 30px max(20px, calc((100% - 960px) / 2)); color: #fff; background: #243447; }
    header h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    header p { margin: 8px 0 0; color: #d5dfeb; }
    main { width: min(960px, calc(100% - 32px)); margin: 24px auto 48px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
    input, button { min-height: 42px; padding: 9px 12px; border: 1px solid #c8d0d8; border-radius: 7px; font: inherit; }
    input { flex: 1; min-width: 0; background: #fff; }
    button { cursor: pointer; color: #fff; border-color: #243447; background: #243447; }
    button:hover { background: #344c66; }
    .summary { margin: 0 0 18px; color: #56616d; font-size: .9rem; }
    .campaign { margin: 22px 0; }
    .campaign h2 { margin: 0 0 10px; font-size: 1.15rem; }
    .card { padding: 16px; margin: 10px 0; border: 1px solid #d9dfe5; border-radius: 9px; background: #fff; }
    .card h3 { margin: 0; font-size: 1.05rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 7px; color: #56616d; font-size: .88rem; }
    .description { margin: 10px 0 0; line-height: 1.5; }
    .empty { padding: 16px; border: 1px dashed #b9c2cc; border-radius: 8px; color: #56616d; background: #fff; }
    footer { padding-top: 12px; border-top: 1px solid #d9dfe5; color: #697580; font-size: .8rem; }
    @media print {
      :root { background: #fff; }
      header { padding: 0 0 16px; color: #111; background: #fff; }
      header p { color: #444; }
      main { width: 100%; margin: 16px 0; }
      .toolbar, footer { display: none; }
      .card, .empty { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Catálogo de personagens</h1>
    <p>Informações públicas das campanhas, disponíveis sem conexão com a internet.</p>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar por nome, profissão ou campanha" aria-label="Buscar personagens">
      <button id="print" type="button">Imprimir</button>
    </div>
    <p id="summary" class="summary" aria-live="polite"></p>
    <div id="catalog"></div>
    <footer>Catálogo estático gerado em 01/10/2026. Contém somente personagens e campos com visibilidade pública no momento da geração.</footer>
  </main>
  <script>
    const campaigns = [
      { name: "Heaven's World", characters: [] },
      { name: "Aincrad — Demonstração", characters: [] }
    ];
    const catalog = document.querySelector('#catalog');
    const summary = document.querySelector('#summary');
    const search = document.querySelector('#search');

    function render() {
      const term = search.value.trim().toLocaleLowerCase('pt-BR');
      const visible = campaigns.map((campaign) => ({
        ...campaign,
        characters: campaign.characters.filter((character) =>
          [campaign.name, character.name, character.profession, character.description, ...(character.tags ?? [])]
            .filter(Boolean)
            .some((value) => value.toLocaleLowerCase('pt-BR').includes(term))
        )
      }));
      const total = visible.reduce((count, campaign) => count + campaign.characters.length, 0);
      summary.textContent = total === 1 ? '1 personagem encontrado.' : `${total} personagens encontrados.`;
      catalog.replaceChildren();

      if (!campaigns.some((campaign) => campaign.characters.length)) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'Nenhum personagem com visibilidade pública foi encontrado nas campanhas no momento da geração. Personagens privados ou ainda não descobertos não são incluídos neste catálogo.';
        catalog.append(empty);
        return;
      }

      for (const campaign of visible) {
        if (!campaign.characters.length) continue;
        const section = document.createElement('section');
        section.className = 'campaign';
        const heading = document.createElement('h2');
        heading.textContent = campaign.name;
        section.append(heading);

        for (const character of campaign.characters) {
          const card = document.createElement('article');
          card.className = 'card';
          const name = document.createElement('h3');
          name.textContent = character.name;
          card.append(name);
          const meta = document.createElement('div');
          meta.className = 'meta';
          if (character.profession) meta.append(document.createTextNode(character.profession));
          if (character.level) meta.append(document.createTextNode(`Nível ${character.level}`));
          if (character.tags?.length) meta.append(document.createTextNode(character.tags.join(' · ')));
          if (meta.childNodes.length) card.append(meta);
          if (character.description) {
            const description = document.createElement('p');
            description.className = 'description';
            description.textContent = character.description;
            card.append(description);
          }
          section.append(card);
        }
        catalog.append(section);
      }
    }

    search.addEventListener('input', render);
    document.querySelector('#print').addEventListener('click', () => window.print());
    render();
  </script>
</body>
</html>
